[package]
name = "mixedlm"
version = "1.2.0"
edition = "2024"
license = "MIT"
rust-version = "1.93"

[lib]
name = "_rust"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["extension-module", "abi3-py310"] }
numpy = "0.29.0"
faer = { version = "0.24.0", default-features = false, features = ["std", "rayon", "linalg", "sparse-linalg"] }
rand = "0.10.2"
rayon = "1.11.0"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = false

[profile.release.build-override]
opt-level = 3
