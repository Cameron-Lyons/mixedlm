[package]
name = "mixedlm"
version = "1.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.93"

[lib]
name = "_rust"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["extension-module", "abi3-py310"] }
numpy = "0.29.0"
sprs = "0.11.4"
sprs-ldl = "0.10.0"
nalgebra = "0.35.0"
nalgebra-sparse = "0.12.0"
faer = "0.24.0"
rand = "0.9.0"
rand_distr = "0.5.0"
rayon = "1.11.0"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = false

[profile.release.build-override]
opt-level = 3
