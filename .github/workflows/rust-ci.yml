name: Rust CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_RETRY: "10"
  RUSTFLAGS: -D warnings
  CARGO_MANIFEST_PATH: fuzz/Cargo.toml

jobs:
  # Stable compatibility complements the main workflow's nightly sanitizer/lint gate.
  rust:
    name: Rust checks (fuzz/Cargo.toml)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component clippy --component rustfmt
          rustup default stable

      - name: Check formatting
        run: cargo fmt --all --manifest-path "$CARGO_MANIFEST_PATH" -- --check

      - name: Build with warnings denied
        run: cargo build --locked --manifest-path "$CARGO_MANIFEST_PATH" --all-targets --all-features

      - name: Verify fuzz mathematical oracles and production sparse code
        run: cargo test --locked --manifest-path "$CARGO_MANIFEST_PATH" --lib

      - name: Run clippy with warnings denied
        run: cargo clippy --locked --manifest-path "$CARGO_MANIFEST_PATH" --all-targets --all-features -- -D warnings
