name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

env:
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_RETRY: "10"

jobs:
  build-wheels:
    name: Build wheels on ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
            rustflags: "-C target-cpu=x86-64-v2"
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
            rustflags: "-C target-cpu=x86-64-v2"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rustflags: "-C target-cpu=x86-64-v2"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist
          manylinux: ${{ matrix.manylinux || 'auto' }}
          sccache: true
        env:
          RUSTFLAGS: ${{ matrix.rustflags || '' }}

      - name: Verify installed wheel on the target platform
        shell: bash
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -I tools/native_build.py
          python -I tools/check_wheel.py

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl

  build-wheels-free-threaded:
    name: Build free-threaded wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.14t
        uses: actions/setup-python@v7
        with:
          python-version: "3.14t"

      - name: Build wheels (free-threaded)
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist -i python3.14t
          manylinux: ${{ matrix.manylinux || 'auto' }}
          sccache: true

      - name: Verify installed free-threaded wheel on the target platform
        shell: bash
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -I tools/native_build.py
          python -I tools/check_wheel.py --expect-free-threaded

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-freethreaded-${{ matrix.target }}
          path: dist/*.whl

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Rebuild and verify the source distribution
        run: |
          uv venv --python python .venv-sdist
          uv pip install --python .venv-sdist/bin/python --config-setting=build-args=--locked dist/*.tar.gz
          mkdir sdist-source
          tar -xzf dist/*.tar.gz -C sdist-source
          .venv-sdist/bin/python -I tools/native_build.py --source-root sdist-source/*
          .venv-sdist/bin/python -I tools/check_wheel.py

      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build-wheels, build-wheels-free-threaded, build-sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: List distributions
        run: ls -la dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
