name: Wheels

# Builds and verifies every distribution; called by CI and by the release workflow.
on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_RETRY: "10"

jobs:
  build:
    name: Build wheels on ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
            rustflags: "-C target-cpu=x86-64-v2"
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
            rustflags: "-C target-cpu=x86-64-v2"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rustflags: "-C target-cpu=x86-64-v2"
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist
          manylinux: ${{ matrix.manylinux || 'auto' }}
          sccache: true
        env:
          RUSTFLAGS: ${{ matrix.rustflags || '' }}

      - name: Verify installed wheel on the target platform
        shell: bash
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -I tools/native_build.py
          python -I tools/check_wheel.py

      - name: Run installed-wheel numerical and thread regressions
        shell: bash
        env:
          CI_PYTHON_EXECUTABLE: ${{ steps.python.outputs.python-path }}
        run: |
          uv sync --locked --no-install-project --python "$CI_PYTHON_EXECUTABLE"
          uv pip install --no-deps dist/*.whl
          uv run --no-sync python -I tools/check_wheel.py
          uv run --no-sync python -I -m pytest tests/ -m installed_wheel --strict-config --strict-markers -ra

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl

  build-free-threaded:
    name: Build free-threaded wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python 3.14t
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14t"

      - name: Build wheels (free-threaded)
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist -i python3.14t
          manylinux: ${{ matrix.manylinux || 'auto' }}
          sccache: true

      - name: Verify installed free-threaded wheel on the target platform
        shell: bash
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -I tools/native_build.py
          python -I tools/check_wheel.py --expect-free-threaded

      - name: Run installed-wheel numerical and thread regressions
        shell: bash
        env:
          CI_PYTHON_EXECUTABLE: ${{ steps.python.outputs.python-path }}
        run: |
          # Polars has no free-threaded wheels; this suite uses core dependencies.
          uv sync --locked --no-install-project --python "$CI_PYTHON_EXECUTABLE" --no-install-package polars --no-install-package polars-runtime-32
          uv pip install --no-deps dist/*.whl
          uv run --no-sync python -I tools/check_wheel.py --expect-free-threaded
          uv run --no-sync python -I -m pytest tests/ -m installed_wheel --strict-config --strict-markers -ra

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-freethreaded-${{ matrix.target }}
          path: dist/*.whl

  sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Rebuild and verify the source distribution
        env:
          CI_PYTHON_EXECUTABLE: ${{ steps.python.outputs.python-path }}
        run: |
          uv venv --python "$CI_PYTHON_EXECUTABLE" .venv-sdist
          uv pip install --python .venv-sdist/bin/python --config-setting=build-args=--locked dist/*.tar.gz
          mkdir sdist-source
          tar -xzf dist/*.tar.gz -C sdist-source
          .venv-sdist/bin/python -I tools/native_build.py --source-root sdist-source/*
          .venv-sdist/bin/python -I tools/check_wheel.py

      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
