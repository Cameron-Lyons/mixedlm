name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_RETRY: "10"

jobs:
  security:
    uses: ./.github/workflows/security.yml

  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12

  rust-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            fuzz -> target

      - name: Run Rust tests
        run: cargo test --locked --all-features

      - name: Verify fuzz mathematical oracles against production sparse code
        run: cargo test --locked --manifest-path fuzz/Cargo.toml --lib

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            fuzz -> target

      - name: Run clippy
        run: |
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo clippy --locked --manifest-path fuzz/Cargo.toml --all-targets --all-features -- -D warnings

  rust-fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: |
          cargo fmt --check
          cargo fmt --all --manifest-path fuzz/Cargo.toml -- --check

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Install locked quality dependencies
        run: uv sync --locked --no-install-project --python 3.12

      - name: Run ruff check
        run: uv run --no-sync ruff check python/ tests/ tools/ benchmarks/

      - name: Run ruff format check
        run: uv run --no-sync ruff format --check python/ tests/ tools/ benchmarks/

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Install locked quality dependencies
        run: uv sync --locked --no-install-project --python 3.12

      - name: Run mypy type check
        run: uv run --no-sync mypy python/ tools/ --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install locked test dependencies
        run: uv sync --locked --no-install-project --python "${{ matrix.python-version }}" ${{ matrix.python-version == '3.12' && '--extra plots --extra optimizers' || '' }}

      - name: Require optional dependencies in the complete feature test run
        if: matrix.python-version == '3.12'
        run: uv run --no-sync python -c "import matplotlib, nlopt, polars"

      - name: Build package
        uses: PyO3/maturin-action@v1
        with:
          command: develop
          args: --release --locked --uv
          sccache: true
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv

      - name: Require source-matched native backend
        run: uv run --no-sync python -m tools.native_build

      - name: Run tests with coverage
        run: uv run --no-sync pytest tests/ --strict-config --strict-markers -ra --cov=mixedlm --cov-branch --cov-report=xml ${{ matrix.python-version == '3.12' && '--cov-fail-under=87' || '' }} --ignore=tests/test_property.py --ignore=tests/test_benchmark.py

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        if: matrix.python-version == '3.12'
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: ${{ github.event_name == 'push' }}

  test-free-threaded:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.14t (free-threaded)
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14t"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install locked test dependencies
        env:
          CI_PYTHON_EXECUTABLE: ${{ steps.python.outputs.python-path }}
        # Polars has no free-threaded wheels; its optional tests run in the standard Python jobs.
        run: >-
          uv sync --locked --no-install-project --python "$CI_PYTHON_EXECUTABLE" --extra plots
          --no-install-package polars --no-install-package polars-runtime-32

      - name: Build package (free-threaded)
        uses: PyO3/maturin-action@v1
        with:
          command: build
          manylinux: "off"
          args: --release --locked --interpreter .venv/bin/python --out dist

      - name: Install package without changing locked dependencies
        run: uv pip install --python .venv/bin/python --no-deps dist/*.whl

      - name: Require source-matched native backend
        run: uv run --no-sync python -m tools.native_build

      - name: Require installed-wheel checks to preserve free-threaded execution
        run: uv run --no-sync python -I tools/check_wheel.py --expect-free-threaded

      - name: Run tests
        run: uv run --no-sync pytest tests/ --strict-config --strict-markers -ra --ignore=tests/test_property.py --ignore=tests/test_benchmark.py

  test-minimum:
    name: Minimum runtime dependencies (Python 3.10)
    needs: wheels
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # NumPy 1.23.5's bundled OpenBLAS has a faulty AVX-512 path on newer CPUs.
      # Use a kernel supported by the wheel's x86-64-v2 baseline for this job.
      OPENBLAS_CORETYPE: Nehalem
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.10
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Download the modern abi3 wheel
        uses: actions/download-artifact@v8
        with:
          name: wheels-x86_64-unknown-linux-gnu
          path: dist

      - name: Install locked test tools and minimum runtime dependencies
        env:
          CI_PYTHON_EXECUTABLE: ${{ steps.python.outputs.python-path }}
        run: |
          uv export --locked --only-group dev --no-emit-project --no-hashes --format requirements-txt --output-file test-tools.txt
          uv venv --python "$CI_PYTHON_EXECUTABLE" .venv-minimum
          uv pip install --python .venv-minimum/bin/python --requirements test-tools.txt numpy==1.23.5 scipy==1.14.0 pandas==1.4.0
          uv pip install --python .venv-minimum/bin/python --no-deps dist/*.whl

      - name: Verify installed wheel with minimum runtime dependencies
        run: |
          .venv-minimum/bin/python -I tools/native_build.py
          .venv-minimum/bin/python -I tools/check_wheel.py

      - name: Run the minimum-dependency core suite from the installed wheel
        run: .venv-minimum/bin/python -I -m pytest tests/ --strict-config --strict-markers -ra --ignore=tests/test_property.py --ignore=tests/test_benchmark.py

  rust-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Generate coverage
        run: cargo llvm-cov --locked --all-features --lcov --output-path lcov.info

      - name: Upload Rust coverage
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: ${{ github.event_name == 'push' }}

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Install locked docs dependencies
        run: uv sync --locked --no-install-project --python 3.12 --extra docs

      - name: Build docs
        run: uv run --no-sync mkdocs build --strict

  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install locked benchmark dependencies
        run: uv sync --locked --no-install-project --python 3.12

      - name: Build package
        uses: PyO3/maturin-action@v1
        with:
          command: develop
          args: --release --locked --uv
          sccache: true
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv

      - name: Require source-matched native backend
        run: uv run --no-sync python -m tools.native_build

      # Pull requests run each benchmark once to check its results; timings are
      # recorded only for main, where runs are comparable over time.
      - name: Check benchmark results
        if: github.event_name == 'pull_request'
        run: uv run --no-sync pytest tests/test_benchmark.py --strict-config --strict-markers --benchmark-disable -ra

      - name: Run timed benchmarks
        if: github.event_name != 'pull_request'
        run: uv run --no-sync pytest tests/test_benchmark.py --strict-config --strict-markers --benchmark-only --benchmark-save=ci --benchmark-storage=benchmark-results

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: benchmark-results/**/*.json
          include-hidden-files: true
        if: always() && github.event_name != 'pull_request'

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust (MSRV)
        uses: dtolnay/rust-toolchain@1.93

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check MSRV
        run: cargo check --locked --all-features

  property-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install locked property test dependencies
        run: uv sync --locked --no-install-project --python 3.12

      - name: Build package
        uses: PyO3/maturin-action@v1
        with:
          command: develop
          args: --release --locked --uv
          sccache: true
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv

      - name: Require source-matched native backend
        run: uv run --no-sync python -m tools.native_build

      - name: Run property-based tests
        run: uv run --no-sync pytest tests/test_property.py --strict-config --strict-markers --hypothesis-show-statistics

  fuzz-smoke:
    uses: ./.github/workflows/fuzz.yml
    with:
      max_total_time: 10

  wheels:
    uses: ./.github/workflows/wheels.yml

  required:
    name: Required CI checks
    if: always()
    needs:
      - security
      - workflows
      - rust-test
      - clippy
      - rust-fmt
      - lint
      - typecheck
      - test
      - test-free-threaded
      - test-minimum
      - rust-coverage
      - docs
      - benchmark
      - msrv
      - property-tests
      - fuzz-smoke
      - wheels
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job to succeed
        env:
          JOB_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $JOB_RESULTS; do
            if [ "$result" != success ]; then
              echo "A required CI job failed or did not complete: $JOB_RESULTS"
              exit 1
            fi
          done
