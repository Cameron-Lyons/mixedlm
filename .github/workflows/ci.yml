name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_NET_RETRY: "10"

jobs:
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12

  rust-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run Rust tests
        run: cargo test --locked --all-features

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

  rust-fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Install locked quality dependencies
        run: uv sync --locked --no-install-project --python 3.12

      - name: Run ruff check
        run: uv run --no-sync ruff check python/ tests/ tools/

      - name: Run ruff format check
        run: uv run --no-sync ruff format --check python/ tests/ tools/

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Install locked quality dependencies
        run: uv sync --locked --no-install-project --python 3.12

      - name: Run mypy type check
        run: uv run --no-sync mypy python/ tools/ --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install locked test dependencies
        run: uv sync --locked --no-install-project --python "${{ matrix.python-version }}" ${{ matrix.python-version == '3.12' && '--extra plots --extra optimizers' || '' }}

      - name: Require optional dependencies in the complete feature test run
        if: matrix.python-version == '3.12'
        run: uv run --no-sync python -c "import matplotlib, nlopt, polars"

      - name: Build package
        uses: PyO3/maturin-action@v1
        with:
          command: develop
          args: --release --locked --uv
          sccache: true
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv

      - name: Require source-matched native backend
        run: uv run --no-sync python -m tools.native_build

      - name: Run tests with coverage
        run: uv run --no-sync pytest tests/ --strict-config --strict-markers -ra --cov=mixedlm --cov-branch --cov-report=xml ${{ matrix.python-version == '3.12' && '--cov-fail-under=87' || '' }} --ignore=tests/test_property.py --ignore=tests/test_benchmark.py

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        if: matrix.python-version == '3.12'
        with:
          files: coverage.xml
          fail_ci_if_error: false

  test-free-threaded:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.14t (free-threaded)
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14t"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install locked test dependencies
        env:
          CI_PYTHON_EXECUTABLE: ${{ steps.python.outputs.python-path }}
        # Polars has no free-threaded wheels; its optional tests run in the standard Python jobs.
        run: >-
          uv sync --locked --no-install-project --python "$CI_PYTHON_EXECUTABLE" --extra plots
          --no-install-package polars --no-install-package polars-runtime-32

      - name: Build package (free-threaded)
        uses: PyO3/maturin-action@v1
        with:
          command: build
          manylinux: "off"
          args: --release --locked --interpreter .venv/bin/python --out dist

      - name: Install package without changing locked dependencies
        run: uv pip install --python .venv/bin/python --no-deps dist/*.whl

      - name: Require source-matched native backend
        run: uv run --no-sync python -m tools.native_build

      - name: Require installed-wheel checks to preserve free-threaded execution
        run: uv run --no-sync python -I tools/check_wheel.py --expect-free-threaded

      - name: Run tests
        run: uv run --no-sync pytest tests/ --strict-config --strict-markers -ra --ignore=tests/test_property.py --ignore=tests/test_benchmark.py

  test-minimum:
    name: Minimum runtime dependencies (Python 3.10)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # NumPy 1.23.5's bundled OpenBLAS has a faulty AVX-512 path on newer CPUs.
      # Use a kernel supported by the wheel's x86-64-v2 baseline for this job.
      OPENBLAS_CORETYPE: Nehalem
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.10
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Download the modern abi3 wheel
        uses: actions/download-artifact@v8
        with:
          name: wheels-x86_64-unknown-linux-gnu
          path: dist

      - name: Install locked test tools and minimum runtime dependencies
        env:
          CI_PYTHON_EXECUTABLE: ${{ steps.python.outputs.python-path }}
        run: |
          uv export --locked --only-group dev --no-emit-project --no-hashes --format requirements-txt --output-file test-tools.txt
          uv venv --python "$CI_PYTHON_EXECUTABLE" .venv-minimum
          uv pip install --python .venv-minimum/bin/python --requirements test-tools.txt numpy==1.23.5 scipy==1.14.0 pandas==1.4.0
          uv pip install --python .venv-minimum/bin/python --no-deps dist/*.whl

      - name: Verify installed wheel with minimum runtime dependencies
        run: |
          .venv-minimum/bin/python -I tools/native_build.py
          .venv-minimum/bin/python -I tools/check_wheel.py

      - name: Run the minimum-dependency core suite from the installed wheel
        run: .venv-minimum/bin/python -I -m pytest tests/ --strict-config --strict-markers -ra --ignore=tests/test_property.py --ignore=tests/test_benchmark.py

  rust-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Generate coverage
        run: cargo llvm-cov --locked --all-features --lcov --output-path lcov.info

      - name: Upload Rust coverage
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          fail_ci_if_error: false

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Install locked docs dependencies
        run: uv sync --locked --no-install-project --python 3.12 --extra docs

      - name: Build docs
        run: uv run --no-sync mkdocs build --strict

  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install locked benchmark dependencies
        run: uv sync --locked --no-install-project --python 3.12

      - name: Build package
        uses: PyO3/maturin-action@v1
        with:
          command: develop
          args: --release --locked --uv
          sccache: true
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv

      - name: Require source-matched native backend
        run: uv run --no-sync python -m tools.native_build

      - name: Run benchmarks
        run: uv run --no-sync pytest tests/test_benchmark.py --strict-config --strict-markers --benchmark-only --benchmark-save=ci --benchmark-storage=benchmark-results

      - name: Upload benchmark results
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results
          path: benchmark-results/**/*.json
          include-hidden-files: true
        if: always()

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust (MSRV)
        uses: dtolnay/rust-toolchain@1.93

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Check MSRV
        run: cargo check --locked --all-features

  miri:
    runs-on: ubuntu-latest
    # Full Miri normally takes about 45 minutes; cap hangs without dropping its coverage.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Run Miri
        run: cargo miri test --locked --lib
        env:
          MIRIFLAGS: "-Zmiri-disable-isolation -Zmiri-permissive-provenance"

  property-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install locked property test dependencies
        run: uv sync --locked --no-install-project --python 3.12

      - name: Build package
        uses: PyO3/maturin-action@v1
        with:
          command: develop
          args: --release --locked --uv
          sccache: true
        env:
          VIRTUAL_ENV: ${{ github.workspace }}/.venv

      - name: Require source-matched native backend
        run: uv run --no-sync python -m tools.native_build

      - name: Run property-based tests
        run: uv run --no-sync pytest tests/test_property.py --strict-config --strict-markers --hypothesis-show-statistics

  fuzz-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src, rustfmt, clippy

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Verify cargo-fuzz installation
        run: cargo +nightly fuzz --version

      - name: Rust fuzz cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target

      - name: Verify mathematical fuzz oracles
        run: cargo test --locked --manifest-path fuzz/Cargo.toml --lib

      - name: Require fuzz formatting and clippy
        run: |
          cargo fmt --all --manifest-path fuzz/Cargo.toml -- --check
          cargo clippy --locked --manifest-path fuzz/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Fuzz production sparse factorization and input validation
        working-directory: fuzz
        run: |
          # Prebuilt cargo-fuzz may default to musl; ASAN needs the runner's GNU target.
          cargo +nightly fuzz run fuzz_cholesky --target x86_64-unknown-linux-gnu -- -max_total_time=10
          cargo +nightly fuzz run fuzz_csc --target x86_64-unknown-linux-gnu -- -max_total_time=10
          git diff --exit-code -- Cargo.lock

      - name: Upload reproducible fuzz failures
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-smoke-crashes
          path: fuzz/artifacts/
          if-no-files-found: ignore

  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
            rustflags: "-C target-cpu=x86-64-v2"
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
            rustflags: ""
          - os: macos-14
            target: aarch64-apple-darwin
            rustflags: ""
          - os: macos-15-intel
            target: x86_64-apple-darwin
            rustflags: "-C target-cpu=x86-64-v2"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rustflags: "-C target-cpu=x86-64-v2"
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist
          manylinux: ${{ matrix.manylinux || 'auto' }}
          sccache: true
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}

      - name: Verify installed wheel on the target platform
        shell: bash
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -I tools/native_build.py
          python -I tools/check_wheel.py

      - name: Run installed-wheel numerical and thread regressions
        shell: bash
        env:
          CI_PYTHON_EXECUTABLE: ${{ steps.python.outputs.python-path }}
        run: |
          uv sync --locked --no-install-project --python "$CI_PYTHON_EXECUTABLE"
          uv pip install --no-deps dist/*.whl
          uv run --no-sync python -I tools/check_wheel.py
          uv run --no-sync python -I -m pytest tests/test_statistical_golden.py tests/test_joint_pnls.py tests/test_lmm_prepared_threads.py tests/test_prepared_glmm_threads.py tests/test_random_effect_simulation.py tests/test_glmm_prediction_uncertainty.py tests/test_cross_validation_scores.py --strict-config --strict-markers -ra

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl

  build-free-threaded:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
          - os: macos-14
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python 3.14t
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14t"

      - name: Build wheels (free-threaded)
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist -i python3.14t
          manylinux: ${{ matrix.manylinux || 'auto' }}
          sccache: true

      - name: Verify installed free-threaded wheel on the target platform
        shell: bash
        run: |
          python -m pip install --force-reinstall dist/*.whl
          python -I tools/native_build.py
          python -I tools/check_wheel.py --expect-free-threaded

      - name: Run installed-wheel numerical and thread regressions
        shell: bash
        env:
          CI_PYTHON_EXECUTABLE: ${{ steps.python.outputs.python-path }}
        run: |
          # Polars has no free-threaded wheels; this suite uses core dependencies.
          uv sync --locked --no-install-project --python "$CI_PYTHON_EXECUTABLE" --no-install-package polars --no-install-package polars-runtime-32
          uv pip install --no-deps dist/*.whl
          uv run --no-sync python -I tools/check_wheel.py --expect-free-threaded
          uv run --no-sync python -I -m pytest tests/test_statistical_golden.py tests/test_joint_pnls.py tests/test_lmm_prepared_threads.py tests/test_prepared_glmm_threads.py tests/test_random_effect_simulation.py tests/test_glmm_prediction_uncertainty.py tests/test_cross_validation_scores.py --strict-config --strict-markers -ra

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-freethreaded-${{ matrix.target }}
          path: dist/*.whl

  sdist:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - name: Rebuild and verify the source distribution
        env:
          CI_PYTHON_EXECUTABLE: ${{ steps.python.outputs.python-path }}
        run: |
          uv venv --python "$CI_PYTHON_EXECUTABLE" .venv-sdist
          uv pip install --python .venv-sdist/bin/python --config-setting=build-args=--locked dist/*.tar.gz
          mkdir sdist-source
          tar -xzf dist/*.tar.gz -C sdist-source
          .venv-sdist/bin/python -I tools/native_build.py --source-root sdist-source/*
          .venv-sdist/bin/python -I tools/check_wheel.py

      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  required:
    name: Required CI checks
    if: always()
    needs:
      - workflows
      - rust-test
      - clippy
      - rust-fmt
      - lint
      - typecheck
      - test
      - test-free-threaded
      - test-minimum
      - rust-coverage
      - docs
      - benchmark
      - msrv
      - miri
      - property-tests
      - fuzz-smoke
      - build
      - build-free-threaded
      - sdist
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job to succeed
        env:
          JOB_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $JOB_RESULTS; do
            if [ "$result" != success ]; then
              echo "A required CI job failed or did not complete: $JOB_RESULTS"
              exit 1
            fi
          done
