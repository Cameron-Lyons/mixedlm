name: Security

on:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  python-security:
    name: Python Security Scan (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # uv.lock selects separate NumPy/SciPy versions for Python 3.10.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install "${{ matrix.python-version }}"

      - name: Create venv and install dependencies
        run: |
          uv venv --python "${{ matrix.python-version }}"
          uv pip install bandit pip-audit

      - name: Run bandit security scan
        run: uv run --no-sync bandit -r python/ -ll -ii -x "**/tests/**"

      - name: Run pip-audit for dependency vulnerabilities
        run: |
          uv export --locked --no-dev --no-emit-project --no-hashes --format requirements-txt --output-file requirements.txt
          uv run --no-sync pip-audit --progress-spinner off -r requirements.txt

  rust-security:
    name: Rust Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run cargo audit
        run: cargo audit

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0
