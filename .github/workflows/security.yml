name: Security

on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  python-security:
    name: Python Security Scan (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # uv.lock selects separate NumPy/SciPy versions for Python 3.10.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install "${{ matrix.python-version }}"

      - name: Install locked security scanners
        run: uv sync --locked --only-group security --python "${{ matrix.python-version }}"

      - name: Run bandit security scan
        run: uv run --no-sync bandit -r python/ -ll -ii -x "**/tests/**"

      - name: Run pip-audit for dependency vulnerabilities
        run: |
          uv export --locked --no-dev --extra plots --extra optimizers --extra polars --no-emit-project --format requirements-txt --output-file requirements.txt
          # uv exports the complete pinned graph; avoid resolving and installing it again.
          uv run --no-sync pip-audit --strict --disable-pip --require-hashes --progress-spinner off -r requirements.txt

  rust-security:
    name: Rust Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Run cargo audit
        run: |
          cargo audit --file Cargo.lock
          cargo audit --file fuzz/Cargo.lock

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7

      - name: Dependency Review
        uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0, AGPL-3.0
