name: Fuzz Testing

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Verify cargo-fuzz installation
        run: cargo +nightly fuzz --version

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz -> target

      - name: Run fuzz tests
        run: |
          cd fuzz
          cargo test --locked --lib
          # Prebuilt cargo-fuzz may default to musl; ASAN needs the runner's GNU target.
          cargo +nightly fuzz run fuzz_cholesky --target x86_64-unknown-linux-gnu -- -max_total_time=60
          cargo +nightly fuzz run fuzz_csc --target x86_64-unknown-linux-gnu -- -max_total_time=60
          git diff --exit-code -- Cargo.lock

      - name: Upload crash artifacts
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: fuzz-crashes
          path: fuzz/artifacts/
